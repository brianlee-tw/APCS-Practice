<!doctype html><html lang="zh-Hant" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-FND" data-lesson="L-FND-01" data-lab="fnd-code-state-stepper" data-ui-build="fnd-code-state-stepper-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Code-State Stepper</title><link rel="stylesheet" href="/assets/apcs-ui.css"><style>.monoBoard{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px;line-height:1.7;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap}.bigValue{font-size:30px;font-weight:850;letter-spacing:-.03em}.answerButtons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.answerButtons button{min-height:42px}.smallTable{width:100%;border-collapse:collapse}.smallTable td,.smallTable th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}.smallTable th{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}.flowCard{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(255,255,255,.03)}.flowArrow{display:grid;place-items:center;color:var(--cyan);font-size:20px}.choiceCompact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choiceCompact button.on{outline:2px solid var(--cyan);border-color:var(--cyan)}@media(max-width:900px){.flow{grid-template-columns:1fr}}</style></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-FND-01 · Progressive C++</div><div class="labTitle">Code-State Stepper</div><div class="labSub">每一步只顯示真正新增或改變的 typed state。</div></div></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>C++17</h3><div id="code" class="code"></div><div style="display:flex;gap:8px;margin-top:12px"><button id="prev" class="btn">← 上一步</button><button id="next" class="btn primary">下一步 →</button><button id="reset" class="btn">重設</button></div></section><section class="card" data-tone="cyan"><h3>Program state</h3><div id="state" class="monoBoard"></div><div id="why" class="callout" style="--tone:var(--cyan);margin-top:12px"></div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>每一步只顯示真正新增或改變的 typed state。</div></section></div></main></div></div><script src="/assets/apcs-ui.js"></script><script>const lines=['int a, b;','cin >> a >> b;','int sum = a + b;','cout << sum << \'\\n\';'];const S=[{st:'a = ?\nb = ?\nsum = ?',w:'宣告只建立 typed variables；現在還沒有從 stdin 讀值。'},{st:'stdin tokens: 5 10\na = 5\nb = 10\nsum = ?',w:'cin 依序把 token 解析成 int values，寫入 a、b。'},{st:'a = 5\nb = 10\na+b = 15 (int)\nsum = 15',w:'先計算 expression a+b；結果 type 仍是 int，再 assignment 給 sum。'},{st:'stdout: 15\\n',w:'cout 只輸出題目要求的內容；不要自行加 Answer= 等文字。'}];let i=0;const $=x=>document.querySelector(x);function render(){const active=Math.min(i,lines.length-1);$('#code').innerHTML=lines.map((x,j)=>'<span class="codeLine '+(j===active?'on':'')+'">'+APCS_UI.esc(x)+'</span>').join('');$('#state').textContent=S[i].st;$('#why').textContent=S[i].w;$('#prev').disabled=i===0;$('#next').disabled=i===S.length-1}$('#prev').onclick=()=>{i=Math.max(0,i-1);render()};$('#next').onclick=()=>{i=Math.min(S.length-1,i+1);render()};$('#reset').onclick=()=>{i=0;render()};render();</script></body></html>
