<!doctype html><html lang="zh-Hant" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-FND" data-lesson="L-FND-01" data-lab="fnd-exit-console" data-ui-build="fnd-exit-console-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Exit Console</title><link rel="stylesheet" href="/assets/apcs-ui.css"><style>.monoBoard{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px;line-height:1.7;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap}.bigValue{font-size:30px;font-weight:850;letter-spacing:-.03em}.answerButtons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.answerButtons button{min-height:42px}.smallTable{width:100%;border-collapse:collapse}.smallTable td,.smallTable th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}.smallTable th{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}.flowCard{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(255,255,255,.03)}.flowArrow{display:grid;place-items:center;color:var(--cyan);font-size:20px}.choiceCompact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choiceCompact button.on{outline:2px solid var(--cyan);border-color:var(--cyan)}@media(max-width:900px){.flow{grid-template-columns:1fr}}</style></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-FND-01 · Exit Check</div><div class="labTitle">Exit Console</div><div class="labSub">8 題不看上文重建；只判定 Lesson Exit，不寫 RM/IM。</div></div></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><div class="pillRow"><span id="qno" class="pill"></span><span id="score" class="pill"></span></div><h3 id="title" style="margin-top:12px"></h3><div id="prompt" class="body12"></div><div id="area" style="margin-top:12px"></div><div id="fb" class="callout" style="display:none;margin-top:10px"></div><div style="display:flex;gap:8px;margin-top:12px"><button id="check" class="btn primary">提交答案</button><button id="next" class="btn" disabled>下一題</button></div></section><section class="card" data-tone="cyan"><h3>Lesson Exit</h3><div class="progress"><span id="prog"></span></div><div class="callout" style="--tone:var(--cyan);margin-top:12px">8/8：PASS；7/8：修錯題後重試；≤6/8：回對應章節 + Micro Practice。Exit PASS 仍不等於 RM/IM 自動升級。</div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>8 題不看上文重建；只判定 Lesson Exit，不寫 RM/IM。</div></section></div></main></div></div><script src="/assets/apcs-ui.js"></script><script>const Q=[{t:'Q1｜Core model',p:'一行 expression 最先應該判斷什麼？',o:['operand 的 value 與 type','這題像哪個演算法','先加 cout'],a:0,e:'operator semantics 由 operand type 決定。'},{t:'Q2｜integer division',p:'7/2 的 value/type？',o:['3 / int','3.5 / double','3 / double'],a:0,e:'兩邊都是 int。'},{t:'Q3｜conversion timing',p:'double x=5/2; x 為？',o:['2.0','2.5','3.0'],a:0,e:'右邊先算 int division。'},{t:'Q4｜remainder',p:'17%5 為？',o:['2','3','3.4'],a:0,e:'17=3×5+2。'},{t:'Q5｜precedence',p:'2+3*4 為？',o:['14','20','24'],a:0,e:'乘法先。'},{t:'Q6｜bool / logical',p:'(5>2)&&(3==3) 的 type/value？',o:['bool / true','int / 1','bool / false'],a:0,e:'比較與 logical expression 的結果是 bool。'},{t:'Q7｜overflow',p:'1e9×1e9 最安全的競程型別選擇？',o:['long long operands','char','bool'],a:0,e:'結果到 1e18 等級；運算前就要是 64-bit。'},{t:'Q8｜bitwise',p:'5^3 為？',o:['6','8','15'],a:0,e:'0101 XOR 0011 = 0110。'}];let i=0,ok=0;const $=x=>document.querySelector(x);function render(){const q=Q[i];$('#qno').textContent=String(i+1).padStart(2,'0')+' / 08';$('#score').textContent=ok+' correct';$('#title').textContent=q.t;$('#prompt').textContent=q.p;$('#area').innerHTML='<div class="choiceRow" style="--cols:'+q.o.length+'">'+q.o.map((x,j)=>'<span><input class="choiceInput" type="radio" name="a" id="a'+j+'" value="'+j+'"><label class="choiceBox" for="a'+j+'" style="--tone:var(--cyan)"><div class="choiceTitle">'+APCS_UI.esc(x)+'</div></label></span>').join('')+'</div>';$('#fb').style.display='none';$('#next').disabled=true;$('#check').disabled=false;$('#prog').style.setProperty('--p',(i/Q.length*100)+'%')}$('#check').onclick=()=>{const q=Q[i],v=+(document.querySelector('input[name=a]:checked')||{value:-1}).value;$('#fb').style.display='block';if(v===q.a){ok++;$('#fb').style.setProperty('--tone','var(--green)');$('#fb').innerHTML='<b>正確。</b> '+q.e}else{$('#fb').style.setProperty('--tone','var(--amber)');$('#fb').innerHTML='<b>這題要修。</b> '+q.e}$('#check').disabled=true;$('#next').disabled=false};$('#next').onclick=()=>{if(i<Q.length-1){i++;render()}else{const rule=ok===8?'PASS':ok===7?'repair one item':'return to lesson';$('#prog').style.setProperty('--p','100%');$('#title').textContent='Lesson Exit｜'+rule;$('#prompt').textContent='這是立即學習檢查，不是 retained mastery。';$('#area').innerHTML='<div class="metricGrid"><div class="metric"><span>score</span><b>'+ok+'/8</b></div><div class="metric"><span>decision</span><b style="font-size:12px">'+rule+'</b></div></div>';$('#check').style.display=$('#next').style.display='none';$('#fb').style.display='block';$('#fb').style.setProperty('--tone',ok>=7?'var(--green)':'var(--amber)');$('#fb').textContent=ok===8?'24–72 小時後請不看本頁重建最小 I/O + typed expression 程式。':ok===7?'只修錯題，再用自己的話說出 root cause。':'回到對應段落 + Micro Practice，不要背選項。'}};render();</script></body></html>
