<!doctype html><html lang="zh-Hant" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-FND" data-lesson="L-FND-01" data-lab="fnd-bug-hunt" data-ui-build="fnd-bug-hunt-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Bug Hunt</title><link rel="stylesheet" href="/assets/apcs-ui.css"><style>.monoBoard{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px;line-height:1.7;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap}.bigValue{font-size:30px;font-weight:850;letter-spacing:-.03em}.answerButtons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.answerButtons button{min-height:42px}.smallTable{width:100%;border-collapse:collapse}.smallTable td,.smallTable th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}.smallTable th{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}.flowCard{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(255,255,255,.03)}.flowArrow{display:grid;place-items:center;color:var(--cyan);font-size:20px}.choiceCompact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choiceCompact button.on{outline:2px solid var(--cyan);border-color:var(--cyan)}@media(max-width:900px){.flow{grid-template-columns:1fr}}</style></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-FND-01 · Common Mistakes</div><div class="labTitle">Bug Hunt</div><div class="labSub">先找最早的 type / operator / contract 錯誤，再看修法。</div></div></header><main class="labBody"><div class="grid2"><section class="card" data-tone="red"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>Bug scenario</h3><div id="code" class="monoBoard"></div><div id="opts" class="choiceRow" style="--cols:2;margin-top:12px"></div><button id="check" class="btn primary" style="margin-top:12px">找第一個 root cause</button></section><section class="card" data-tone="green"><h3>Root cause</h3><div id="fb" class="callout" style="--tone:var(--green)">先找第一個錯誤假設，不要只選最後看到的錯誤輸出。</div><button id="next" class="btn" style="margin-top:12px" disabled>下一個案例</button><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>先找最早的 type / operator / contract 錯誤，再看修法。</div></section></div></main></div></div><script src="/assets/apcs-ui.js"></script><script>const B=[{c:'int a = 7, b = 2;\ndouble x = a / b;\n// expected by student: 3.5',o:['double 宣告太晚','缺少 if','cin 讀錯','需要 for'],a:0,e:'a/b 先以 int 算成 3；assignment 到 double 只得到 3.0。'},{c:'int a=1000000000,b=1000000000;\nlong long x=a*b;',o:['乘法 operand 仍是 int','long long 不能乘','cout 不支援大數','需要陣列'],a:0,e:'signed int multiplication 可能在寫入 long long 前就 overflow；讓 operand 先成為 long long。'},{c:'int x = 2 ^ 3;\n// student expects 8',o:['^ 被誤當次方','2 太小','需要 double','缺少括號'],a:0,e:'C++ 的 ^ 是 bitwise XOR；0010 XOR 0011 = 0001。'},{c:'cout << "Answer=" << ans;',o:['輸出 contract 多了文字','ans 必須 double','cout 不能串接','需要 endl'],a:0,e:'若 Judge 只要求 ans，額外字元會造成輸出不符。'}];let i=0;const $=x=>document.querySelector(x);function render(){const b=B[i];$('#code').textContent=b.c;$('#opts').innerHTML=b.o.map((x,j)=>'<span><input class="choiceInput" type="radio" name="b" id="b'+j+'" value="'+j+'"><label class="choiceBox" for="b'+j+'" style="--tone:var(--red)"><div class="choiceTitle">'+APCS_UI.esc(x)+'</div></label></span>').join('');$('#fb').textContent='先找第一個錯誤假設，不要只選最後看到的錯誤輸出。';$('#fb').style.setProperty('--tone','var(--green)');$('#next').disabled=true}$('#check').onclick=()=>{const b=B[i],v=+(document.querySelector('input[name=b]:checked')||{value:-1}).value;if(v===b.a){$('#fb').style.setProperty('--tone','var(--green)');$('#fb').innerHTML='<b>根因正確。</b> '+b.e;$('#next').disabled=false}else{$('#fb').style.setProperty('--tone','var(--amber)');$('#fb').innerHTML='<b>再往前找。</b> 目前選到的不是第一個會改變程式語意的地方。'}};$('#next').onclick=()=>{i=(i+1)%B.length;render()};render();</script></body></html>
