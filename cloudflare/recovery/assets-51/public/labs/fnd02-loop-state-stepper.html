<!doctype html><html lang="zh-Hant" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-FND" data-lesson="L-FND-02" data-lab="fnd02-loop-state-stepper" data-ui-build="fnd02-loop-state-stepper-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Loop State Stepper</title><link rel="stylesheet" href="/assets/apcs-ui.css"><style>.labLead{font-size:14px;color:var(--text2);max-width:900px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.stage{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.025)}.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choiceGrid button{min-height:52px}.choiceGrid button.on{outline:2px solid var(--cyan)}.steps{display:grid;gap:8px}.step{border:1px solid var(--line);border-radius:12px;padding:11px;background:rgba(255,255,255,.025)}.step.on{border-color:var(--cyan);background:rgba(89,214,255,.08)}.metric2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:28px;font-weight:900}.muted{color:var(--muted)}@media(max-width:800px){.choiceGrid,.metric2{grid-template-columns:1fr}}</style></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-FND-02 · State transition</div><div class="labTitle">Loop State Stepper</div><div class="labSub">每按一次只走一個 checkpoint：condition → body → update → 回到 condition。</div></div></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>C++17</h3><div class="code">int x = 1;
while (x < 5) {
  cout &lt;&lt; x &lt;&lt; ' ';
  ++x;
}</div><div style="display:flex;gap:8px;margin-top:12px"><button id="next" class="btn primary">下一 checkpoint</button><button id="reset" class="btn">重設</button></div></section><section class="card" data-tone="cyan"><h3>State</h3><div id="state" class="stage mono"></div><div id="why" class="callout" style="--tone:var(--cyan);margin-top:12px"></div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>每一輪 loop 都是 condition → body → update 的狀態轉移；trace 時把它拆成明確步驟。</div></section></div></main></div></div><script src="/assets/apcs-ui.js"></script><script>const S=[['x=1','檢查 1<5 → true'],['x=1\nstdout: 1','執行 body 的輸出'],['x=2\nstdout: 1','++x 更新 state'],['x=2','回到 condition：2<5 → true'],['x=4\nstdout: 1 2 3 4','第 4 輪 body 後'],['x=5\nstdout: 1 2 3 4','更新成 5'],['x=5','5<5 → false，離開 loop']];let i=0;const $=x=>document.querySelector(x);function r(){$('#state').textContent=S[i][0];$('#why').textContent=S[i][1];$('#next').disabled=i===S.length-1}$('#next').onclick=()=>{i=Math.min(S.length-1,i+1);r()};$('#reset').onclick=()=>{i=0;r()};r();</script></body></html>
