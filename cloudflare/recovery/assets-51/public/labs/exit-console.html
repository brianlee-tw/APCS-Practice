<!doctype html><html lang="zh-Hant" data-typography="desktop-readable-v1" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-PFX" data-lesson="L-PFX-01" data-lab="exit-console" data-ui-build="exit-console-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>課末檢查</title><link rel="stylesheet" href="/assets/apcs-ui.css"></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-PFX-01 · Exit Console</div><div class="labTitle">課末檢查</div><div class="labSub">7 題逐題提交；錯題可以精準定位，避免「看過答案」被誤判成真正會了。</div></div><button id="themeBtn" class="themeBtn" type="button">System / Dark / Light</button></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><div class="pillRow"><span id="qno" class="pill"></span><span id="score" class="pill"></span></div><h3 id="title" style="margin-top:12px"></h3><div id="prompt" class="body12"></div><div id="area" style="margin-top:12px"></div><div id="fb" class="callout" style="display:none;margin-top:10px"></div><div style="display:flex;gap:7px;margin-top:12px"><button id="check" class="btn primary">提交答案</button><button id="next" class="btn" disabled>下一題</button></div></section><section class="card" data-tone="cyan"><h3>Lesson Exit</h3><div class="progress"><span id="prog"></span></div><div class="callout" style="--tone:var(--cyan);margin-top:12px">7/7：通過；6/7：只修錯題後重試；≤5/7：回到對應章節 + Micro Practice。這只判定 Lesson Exit，不等於 RM3 / IM3。</div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>能不看正文重建 prefix 定義、range relation、index conversion 與 complexity，才完成 Lesson Exit。</div></section></div></main></div></div><div class="toast"><b></b><p></p></div><script src="/assets/apcs-ui.js"></script><script>document.getElementById('themeBtn').onclick=()=>APCS_UI.theme();const Q=[
{t:'Q1｜定義',p:'pre[k] 的精確語意？',o:['前 k 個元素的總和','a[k] 以前但不含 a[k] 的索引值','第 k 個元素的累積頻率'],a:0,e:'pre[0]=0；pre[k] = a[0]...a[k-1] 的總和。'},
{t:'Q2｜手算',p:'a=[3,-1,4,2]，完整 pre？',o:['[0,3,2,6,8]','[3,2,6,8]','[0,3,4,8,10]'],a:0,e:'從 pre[0]=0 開始逐格累積。'},
{t:'Q3｜推導',p:'inclusive [l,r] 為什麼是 pre[r+1]-pre[l]？',o:['先拿 0..r，再扣掉 0..l-1','因為 r 一定比 l 大 1','因為 prefix 陣列必定遞增'],a:0,e:'兩個 prefix state 相減只留下 a[l..r]。'},
{t:'Q4｜找錯',p:'pre[r]-pre[l] 的主要問題？',o:['漏掉 a[r]','多算 a[l]','只能處理正數'],a:0,e:'單元素 [r,r] 會直接變成 0，是最小反例。'},
{t:'Q5｜複雜度',p:'N=Q=200000，大量 range sum 的合理總複雜度？',o:['O(NQ)','O(N+Q)','O(log N)'],a:1,e:'建表 O(N)，Q 次查詢各 O(1)。'},
{t:'Q6｜溢位',p:'為什麼 pre 常用 long long？',o:['prefix 累積值可能超過單一 int 元素範圍','vector 只能存 long long','負數只能放 long long'],a:0,e:'先估 n × max|a[i]| 的上界。'},
{t:'Q7｜核心 code',p:'pre[i+1] 應該等於？',o:['pre[i] + a[i]','pre[i-1] + a[i]','pre[i] + a[i+1]'],a:0,e:'從 boundary i 跨過 a[i] 到 boundary i+1。'}];let i=0,ok=0,miss=[];const $=s=>document.querySelector(s);function render(){const q=Q[i];$('#qno').textContent='0'+(i+1)+' / 07';$('#score').textContent='目前 '+ok+' 正確';$('#title').textContent=q.t;$('#prompt').textContent=q.p;$('#area').innerHTML='<div class="choiceRow" style="--cols:'+q.o.length+'">'+q.o.map((x,j)=>'<span><input class="choiceInput" type="radio" name="ans" id="a'+j+'" value="'+j+'"><label class="choiceBox" for="a'+j+'" style="--tone:var(--cyan)"><div class="choiceTitle">'+APCS_UI.esc(x)+'</div></label></span>').join('')+'</div>';$('#fb').style.display='none';$('#next').disabled=true;$('#check').disabled=false;$('#prog').style.setProperty('--p',(i/7*100)+'%')}$('#check').onclick=()=>{const q=Q[i],v=+(document.querySelector('input[name=ans]:checked')||{value:-1}).value;$('#fb').style.display='block';if(v===q.a){ok++;$('#fb').style.setProperty('--tone','var(--green)');$('#fb').innerHTML='<b class="statusGood">正確</b> · '+q.e}else{miss.push(i);$('#fb').style.setProperty('--tone','var(--amber)');$('#fb').innerHTML='<b class="statusWarn">這題要修</b> · '+q.e}$('#check').disabled=true;$('#next').disabled=false};$('#next').onclick=()=>{if(i<6){i++;render()}else{finish()}};function finish(){const pass=ok===7?'通過':ok===6?'只修錯題後重試':'回章節 + Micro Practice';$('#prog').style.setProperty('--p','100%');$('#title').textContent='Lesson Exit｜'+pass;$('#prompt').textContent='這是立即學習檢查，不等於 retained mastery。';$('#area').innerHTML='<div class="metricGrid"><div class="metric"><span>Score</span><b>'+ok+'/7</b></div><div class="metric"><span>需要重看</span><b>'+(7-ok)+'</b></div><div class="metric"><span>判定</span><b style="font-size:12px">'+pass+'</b></div></div>';$('#check').style.display=$('#next').style.display='none';$('#fb').style.display='block';$('#fb').style.setProperty('--tone',ok>=6?'var(--green)':'var(--amber)');$('#fb').textContent=ok===7?'可以進下一步，但 24–72 小時後仍需要 delayed validation。':ok===6?'只重做錯的那一題，再確認能自己解釋。':'回到對應章節與微型練習，不要直接背答案。'}render();</script></body></html>
