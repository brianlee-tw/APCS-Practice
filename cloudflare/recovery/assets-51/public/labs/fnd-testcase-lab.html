<!doctype html><html lang="zh-Hant" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-FND" data-lesson="L-FND-01" data-lab="fnd-testcase-lab" data-ui-build="fnd-testcase-lab-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Testcase Lab</title><link rel="stylesheet" href="/assets/apcs-ui.css"><style>.monoBoard{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px;line-height:1.7;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap}.bigValue{font-size:30px;font-weight:850;letter-spacing:-.03em}.answerButtons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.answerButtons button{min-height:42px}.smallTable{width:100%;border-collapse:collapse}.smallTable td,.smallTable th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}.smallTable th{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}.flowCard{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(255,255,255,.03)}.flowArrow{display:grid;place-items:center;color:var(--cyan);font-size:20px}.choiceCompact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choiceCompact button.on{outline:2px solid var(--cyan);border-color:var(--cyan)}@media(max-width:900px){.flow{grid-template-columns:1fr}}</style></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-FND-01 · Common Mistakes</div><div class="labTitle">Testcase Lab</div><div class="labSub">用最小輸入或最小 expression 打破錯誤 mental model。</div></div></header><main class="labBody"><div class="grid2"><section class="card" data-tone="orange"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>Choose a minimal testcase</h3><div class="choiceRow" style="--cols:2" id="cases"></div></section><section class="card" data-tone="cyan"><h3>Correct model vs bug</h3><div id="info" class="monoBoard"></div><div id="compare" class="metricGrid" style="margin-top:12px"></div><div id="why" class="callout" style="--tone:var(--cyan);margin-top:12px"></div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>用最小輸入或最小 expression 打破錯誤 mental model。</div></section></div></main></div></div><script src="/assets/apcs-ui.js"></script><script>const C=[{n:'integer division',code:'double x = 5 / 2;',correct:'2.0',bug:'expect 2.5',why:'division 在 assignment 前已以 int 完成；這個 testcase 專門打破「左邊 double 會救右邊」的錯覺。'},{n:'overflow',code:'int a=1000000000, b=1000000000;\nlong long x = a*b;',correct:'右側有 signed overflow 風險',bug:'以為 x 是 long long 就安全',why:'operator 先看 operand type。要讓乘法本身在 64-bit 執行。'},{n:'output contract',code:'cout << "Answer = " << 15;',correct:'若 Judge 只要 15，這會 WA',bug:'以為多說明比較清楚',why:'OJ 比的是輸出 contract，不是人類可讀性。'},{n:'logical vs bitwise',code:'5 && 3   vs   5 & 3',correct:'true(1) vs 1',bug:'把 && 與 & 當同一種',why:'logical 把 operand 視為真假；bitwise 逐 bit 計算。'}];let i=0;const $=x=>document.querySelector(x);function render(){const c=C[i];$('#cases').innerHTML=C.map((x,j)=>'<span><input class="choiceInput" type="radio" name="c" id="c'+j+'" '+(i===j?'checked':'')+'><label class="choiceBox" for="c'+j+'" style="--tone:var(--orange)"><div class="choiceTitle">'+APCS_UI.esc(x.n)+'</div></label></span>').join('');document.querySelectorAll('input[name=c]').forEach((x,j)=>x.onchange=()=>{i=j;render()});$('#info').textContent=c.code;$('#compare').innerHTML='<div class="metric"><span>correct</span><b style="font-size:12px">'+APCS_UI.esc(c.correct)+'</b></div><div class="metric"><span>bug model</span><b style="font-size:12px">'+APCS_UI.esc(c.bug)+'</b></div>';$('#why').textContent=c.why}render();</script></body></html>
