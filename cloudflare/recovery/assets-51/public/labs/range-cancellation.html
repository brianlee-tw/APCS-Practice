<!doctype html><html lang="zh-Hant" data-typography="desktop-readable-v1" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-PFX" data-lesson="L-PFX-01" data-lab="range-cancellation" data-ui-build="range-cancellation-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>區間扣除視覺化</title><link rel="stylesheet" href="/assets/apcs-ui.css"></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-PFX-01 · Derivation</div><div class="labTitle">區間扣除視覺化</div><div class="labSub">不要背公式；直接看「先拿到 0..r，再扣掉 0..l-1」如何留下 [l,r]。</div></div><button id="themeBtn" class="themeBtn" type="button">System / Dark / Light</button></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>選一段 inclusive range</h3><div id="arr" class="array"></div><div class="grid2" style="margin-top:14px"><label><span class="label">l</span><input id="l" class="field" type="range" min="0" max="4" value="1"></label><label><span class="label">r</span><input id="r" class="field" type="range" min="0" max="4" value="3"></label></div></section><section class="card" data-tone="green"><h3>拿太多，再扣掉</h3><div class="metricGrid"><div class="metric"><span>pre[r+1]</span><b id="all"></b></div><div class="metric"><span>pre[l]</span><b id="drop"></b></div><div class="metric"><span>range sum</span><b id="ans"></b></div></div><div id="formula" class="callout" style="--tone:var(--green);margin-top:12px"></div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>range sum 公式不是魔法：兩個 prefix 相減會把左側共同部分抵消，只留下目標區間。</div></section></div></main></div></div><div class="toast"><b></b><p></p></div><script src="/assets/apcs-ui.js"></script><script>document.getElementById('themeBtn').onclick=()=>APCS_UI.theme();const A=[4,-2,7,1,3],PRE=[0,4,2,9,10,13],$=s=>document.querySelector(s);function r(changed){let l=+$('#l').value,rr=+$('#r').value;if(l>rr){if(changed==='l')rr=l;else l=rr;$('#l').value=l;$('#r').value=rr}$('#arr').innerHTML=A.map((v,j)=>'<div class="cell '+(j<l?'drop':j<=rr?'keep':'')+'"><span class="idx">a['+j+']</span><span class="val">'+v+'</span></div>').join('');const a=PRE[rr+1],d=PRE[l];$('#all').textContent=a;$('#drop').textContent=d;$('#ans').textContent=a-d;$('#formula').innerHTML='<span class="mono">sum['+l+','+rr+'] = pre['+(rr+1)+'] - pre['+l+'] = '+a+' - '+d+' = '+(a-d)+'</span><div class="helper">pre[r+1] 先拿到 0..r；pre[l] 扣掉 0..l-1。</div>'}$('#l').oninput=()=>r('l');$('#r').oninput=()=>r('r');r();</script></body></html>
