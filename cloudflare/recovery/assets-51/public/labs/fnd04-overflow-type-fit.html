<!doctype html><html lang="zh-Hant" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-FND" data-lesson="L-FND-04" data-lab="fnd04-overflow-type-fit" data-ui-build="fnd04-overflow-type-fit-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Overflow / Type-Fit Lab</title><link rel="stylesheet" href="/assets/apcs-ui.css"><style>.labLead{font-size:14px;color:var(--text2);max-width:900px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.stage{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.025)}.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choiceGrid button{min-height:52px}.choiceGrid button.on{outline:2px solid var(--cyan)}.steps{display:grid;gap:8px}.step{border:1px solid var(--line);border-radius:12px;padding:11px;background:rgba(255,255,255,.025)}.step.on{border-color:var(--cyan);background:rgba(89,214,255,.08)}.metric2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:28px;font-weight:900}.muted{color:var(--muted)}@media(max-width:800px){.choiceGrid,.metric2{grid-template-columns:1fr}}</style></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-FND-04 · Range reasoning</div><div class="labTitle">Overflow / Type-Fit Lab</div><div class="labSub">先估 intermediate 最大值，再決定 operation 從哪個 operand 開始升到 long long。</div></div></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>a=b=1,000,000,000</h3><div id="choices" class="choiceGrid"></div></section><section class="card" data-tone="cyan"><h3>Type fit</h3><div class="metric2"><div class="stage"><span class="muted">product scale</span><div class="big">10^18</div></div><div class="stage"><span class="muted">int scale</span><div class="big">~2×10^9</div></div></div><div id="fb" class="callout" style="--tone:var(--cyan);margin-top:12px"></div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>先由 constraints 推導中間值與總和上界，再選型別；不能只看 final answer 看起來小。</div></section></div></main></div></div><script src="/assets/apcs-ui.js"></script><script>const O=[['long long x = a*b;',0],['long long x = 1LL*a*b;',1],['int x = a*b;',0],['double x = a*b;',0]];const $=x=>document.querySelector(x);$('#choices').innerHTML=O.map((x,i)=>'<button class="btn" data-i="'+i+'">'+APCS_UI.esc(x[0])+'</button>').join('');document.querySelectorAll('#choices button').forEach(b=>b.onclick=()=>{const g=O[+b.dataset.i][1];$('#fb').style.setProperty('--tone',g?'var(--green)':'var(--amber)');$('#fb').textContent=g?'正確。1LL 讓 multiplication 本身從第一步就是 64-bit。':'左值型別太晚；檢查右側 operands / intermediate operation。'});</script></body></html>
