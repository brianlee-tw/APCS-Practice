<!doctype html><html lang="zh-Hant" data-typography="desktop-readable-v1" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-PFX" data-lesson="L-PFX-01" data-lab="code-state-stepper" data-ui-build="code-state-stepper-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>程式與狀態步進器</title><link rel="stylesheet" href="/assets/apcs-ui.css"></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-PFX-01 · Progressive C++</div><div class="labTitle">程式與狀態步進器</div><div class="labSub">左邊是程式執行位置，右邊只顯示那一步真正改變的 state。</div></div><button id="themeBtn" class="themeBtn" type="button">System / Dark / Light</button></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>C++17</h3><div id="code" class="code"></div><div style="display:flex;gap:7px;margin-top:10px"><button id="prev" class="btn">← 上一步</button><button id="next" class="btn primary">下一步 →</button><button id="reset" class="btn">重設</button></div></section><section class="card" data-tone="cyan"><h3>狀態</h3><div id="arr" class="array"></div><div style="height:12px"></div><div id="pre" class="array"></div><div id="explain" class="callout" style="--tone:var(--cyan);margin-top:12px"></div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>建立 prefix 時每一步只新增一個累積 state；trace pre[i+1] 如何由 pre[i] 與 a[i] 產生。</div></section></div></main></div></div><div class="toast"><b></b><p></p></div><script src="/assets/apcs-ui.js"></script><script>document.getElementById('themeBtn').onclick=()=>APCS_UI.theme();const A=[4,-2,7,1,3],$=s=>document.querySelector(s);const lines=['vector<long long> pre(n + 1, 0);','for (int i = 0; i < n; ++i) {','    pre[i + 1] = pre[i] + a[i];','}'];let step=0;function render(){const pre=[0];for(let j=0;j<step;j++)pre.push(pre[j]+A[j]);while(pre.length<6)pre.push(null);$('#code').innerHTML=lines.map((x,j)=>'<span class="codeLine '+((step===0&&j===0)||(step>0&&step<=5&&j===2)||(step===6&&j===3)?'on':'')+'">'+APCS_UI.esc(x)+'</span>').join('');$('#arr').innerHTML=A.map((v,j)=>'<div class="cell '+(j===step-1?'active':'')+'"><span class="idx">a['+j+']</span><span class="val">'+v+'</span></div>').join('');$('#pre').innerHTML=pre.map((v,j)=>'<div class="cell '+(j===step?'active':'')+'"><span class="idx">pre['+j+']</span><span class="val">'+(v===null?'·':v)+'</span></div>').join('');$('#explain').textContent=step===0?'先建立 n+1 格，pre[0]=0。':step<=5?'i='+(step-1)+'：跨過 a['+(step-1)+']，把累積值寫到 pre['+step+']。':'建表完成：每個 prefix state 都代表某個 boundary 以前的總和。';$('#prev').disabled=step===0;$('#next').disabled=step===6}$('#prev').onclick=()=>{step=Math.max(0,step-1);render()};$('#next').onclick=()=>{step=Math.min(6,step+1);render()};$('#reset').onclick=()=>{step=0;render()};render();</script></body></html>
