<!doctype html><html lang="zh-Hant" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-FND" data-lesson="L-FND-02" data-lab="fnd02-control-flow-router" data-ui-build="fnd02-control-flow-router-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Control-Flow Router</title><link rel="stylesheet" href="/assets/apcs-ui.css"><style>.labLead{font-size:14px;color:var(--text2);max-width:900px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.stage{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.025)}.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choiceGrid button{min-height:52px}.choiceGrid button.on{outline:2px solid var(--cyan)}.steps{display:grid;gap:8px}.step{border:1px solid var(--line);border-radius:12px;padding:11px;background:rgba(255,255,255,.025)}.step.on{border-color:var(--cyan);background:rgba(89,214,255,.08)}.metric2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:28px;font-weight:900}.muted{color:var(--muted)}@media(max-width:800px){.choiceGrid,.metric2{grid-template-columns:1fr}}</style></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-FND-02 · Core model</div><div class="labTitle">Control-Flow Router</div><div class="labSub">先預測 branch，再讓 router 逐條判斷；比較兩個獨立 if 與 else-if chain。</div></div></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>先選程式</h3><div class="choiceGrid"><button class="btn" data-case="ind">兩個獨立 if</button><button class="btn" data-case="chain">if / else if</button></div><div id="code" class="code" style="margin-top:12px"></div><h3 style="margin-top:14px">x = 8，先預測輸出</h3><div class="choiceGrid"><button class="btn pred" data-v="A">A</button><button class="btn pred" data-v="AB">AB</button></div></section><section class="card" data-tone="cyan"><h3>Router trace</h3><div id="trace" class="steps"></div><div id="fb" class="callout" style="display:none;margin-top:12px"></div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>條件式不是「都執行一次」；先依順序判斷條件，再只走真正被選中的 control-flow path。</div></section></div></main></div></div><script src="/assets/apcs-ui.js"></script><script>const $=x=>document.querySelector(x);let c='ind',pred='';const C={ind:{code:'if (x > 0) cout << "A";\nif (x % 2 == 0) cout << "B";',ans:'AB',s:['x>0 → true → 輸出 A','第二個 if 仍會判斷','x%2==0 → true → 輸出 B']},chain:{code:'if (x > 0) cout << "A";\nelse if (x % 2 == 0) cout << "B";',ans:'A',s:['x>0 → true → 輸出 A','chain 已命中第一個 true','else if 不再判斷']}};function r(){$('#code').textContent=C[c].code;$('#trace').innerHTML=C[c].s.map((s,i)=>'<div class="step">0'+(i+1)+' · '+APCS_UI.esc(s)+'</div>').join('');$('#fb').style.display=pred?'block':'none';if(pred){const ok=pred===C[c].ans;$('#fb').style.setProperty('--tone',ok?'var(--green)':'var(--amber)');$('#fb').textContent=(ok?'正確：':'再看一次：')+'獨立 if 會各自判斷；else-if chain 命中後停止。'}}document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{c=b.dataset.case;pred='';r()});document.querySelectorAll('.pred').forEach(b=>b.onclick=()=>{pred=b.dataset.v;r()});r();</script></body></html>
