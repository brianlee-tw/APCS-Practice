<!doctype html><html lang="zh-Hant" data-typography="desktop-readable-v1" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-PFX" data-lesson="L-PFX-01" data-lab="testcase-lab" data-ui-build="testcase-lab-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>測資實驗室</title><link rel="stylesheet" href="/assets/apcs-ui.css"></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-PFX-01 · Common Mistakes</div><div class="labTitle">測資實驗室</div><div class="labSub">用最小測資打破錯誤模型，比背「不要這樣寫」更可靠。</div></div><button id="themeBtn" class="themeBtn" type="button">System / Dark / Light</button></header><main class="labBody"><div class="grid2"><section class="card" data-tone="orange"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>選測資</h3><div class="choiceRow" style="--cols:2" id="cases"></div></section><section class="card" data-tone="cyan"><h3>正確模型 vs 常見錯誤</h3><div id="caseInfo" class="body12"></div><div id="compare" class="metricGrid" style="margin-top:12px"></div><div id="why" class="callout" style="--tone:var(--cyan);margin-top:12px"></div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>Prefix Sum 的測資要碰單元素、整段、左端點、右端點與負數/零，才能抓 index 與型別問題。</div></section></div></main></div></div><div class="toast"><b></b><p></p></div><script src="/assets/apcs-ui.js"></script><script>document.getElementById('themeBtn').onclick=()=>APCS_UI.theme();const C=[
{name:'單元素',a:[9],l:0,r:0,bug:'pre[r]-pre[l]',why:'inclusive 單元素最容易揭露「漏掉 a[r]」；正確答案應為 9。'},
{name:'左端點 0',a:[4,-2,7],l:0,r:1,bug:'l-1 索引',why:'pre[0]=0 讓 l=0 不需要特判；如果硬做 l-1 很容易越界。'},
{name:'負數',a:[4,-8,3],l:0,r:2,bug:'假設 pre 遞增',why:'prefix 是累積值，不保證遞增；負數不會讓 prefix sum 失效。'},
{name:'溢位',a:[2000000000,2000000000],l:0,r:1,bug:'int prefix',why:'單一 a[i] 可放進 int，不代表多個值累積後仍安全；答案是 4,000,000,000。'}];let cur=0;const $=s=>document.querySelector(s);function sum(a,l,r){let x=0;for(let i=l;i<=r;i++)x+=a[i];return x}function render(){const c=C[cur],pre=[0];for(const v of c.a)pre.push(pre.at(-1)+v);const correct=pre[c.r+1]-pre[c.l];let wrong=c.bug==='pre[r]-pre[l]'?pre[c.r]-pre[c.l]:c.bug==='int prefix'?'32-bit overflow risk':'模型錯誤';$('#cases').innerHTML=C.map((x,i)=>'<span><input class="choiceInput" type="radio" name="c" id="c'+i+'" '+(i===cur?'checked':'')+'><label class="choiceBox" for="c'+i+'" style="--tone:var(--orange)"><div class="choiceTitle">'+x.name+'</div><div class="choiceDesc">'+x.bug+'</div></label></span>').join('');document.querySelectorAll('input[name=c]').forEach((x,i)=>x.onchange=()=>{cur=i;render()});$('#caseInfo').innerHTML='<div class="array">'+c.a.map((v,i)=>'<div class="cell"><span class="idx">a['+i+']</span><span class="val">'+v+'</span></div>').join('')+'</div><div style="margin-top:10px">range = <span class="mono">['+c.l+','+c.r+']</span></div>';$('#compare').innerHTML='<div class="metric"><span>正確答案</span><b>'+APCS_UI.fmt(correct)+'</b></div><div class="metric"><span>常見錯法</span><b style="font-size:12px">'+wrong+'</b></div><div class="metric"><span>檢查點</span><b>'+c.bug+'</b></div>';$('#why').textContent=c.why}render();</script></body></html>
