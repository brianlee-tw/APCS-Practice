st","break"],"correct":0,"why":"更新 summary state。"},{"q":"count 代表已處理數量，每處理一個元素後？","options":["count++","count=0","不變"],"correct":0,"why":"維持 invariant。"},{"q":"補完後第一個驗證？","options":["trace 最小 case","直接提交大資料"],"correct":0,"why":"用小 case 驗證 state transition。"}]},"debrief":"Code completion 是 state transition reasoning，不是語法填空猜題。","family":"code-reconstruction","why_html":"以缺行或排序 code blocks 重建最小 statement，適合 completion/invariant 而不直接揭露完整答案。","template":"apcs-lab-product-v3"};</script><script src="/assets/apcs-lab-runtime-v3.js"></script></body></html>
