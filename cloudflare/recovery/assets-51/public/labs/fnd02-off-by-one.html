<!doctype html><html lang="zh-Hant" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-FND" data-lesson="L-FND-02" data-lab="fnd02-off-by-one" data-ui-build="fnd02-off-by-one-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Off-by-One Lab</title><link rel="stylesheet" href="/assets/apcs-ui.css"><style>.labLead{font-size:14px;color:var(--text2);max-width:900px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.stage{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.025)}.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choiceGrid button{min-height:52px}.choiceGrid button.on{outline:2px solid var(--cyan)}.steps{display:grid;gap:8px}.step{border:1px solid var(--line);border-radius:12px;padding:11px;background:rgba(255,255,255,.025)}.step.on{border-color:var(--cyan);background:rgba(89,214,255,.08)}.metric2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:28px;font-weight:900}.muted{color:var(--muted)}@media(max-width:800px){.choiceGrid,.metric2{grid-template-columns:1fr}}</style></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-FND-02 · Boundary QA</div><div class="labTitle">Off-by-One Lab</div><div class="labSub">不背「for 跑 n 次」；由 init、condition、update 列出真正接受的 i。</div></div></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>選一個 loop</h3><div id="loops" class="choiceGrid"></div></section><section class="card" data-tone="cyan"><h3>n = 5</h3><div id="vals" class="stage mono"></div><div id="count" class="big" style="margin-top:12px"></div><div id="note" class="callout" style="--tone:var(--cyan);margin-top:12px"></div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>不要用外型猜迴圈跑幾次；列出 condition 為 true 的 index，邊界錯誤會自然浮現。</div></section></div></main></div></div><script src="/assets/apcs-ui.js"></script><script>const A=[['i=0; i<n; ++i',[0,1,2,3,4]],['i=1; i<=n; ++i',[1,2,3,4,5]],['i=1; i<n; ++i',[1,2,3,4]],['i=0; i<=n; ++i',[0,1,2,3,4,5]]];const $=x=>document.querySelector(x);$('#loops').innerHTML=A.map((x,i)=>'<button class="btn" data-i="'+i+'">for('+x[0]+')</button>').join('');document.querySelectorAll('#loops button').forEach(b=>b.onclick=()=>{const v=A[+b.dataset.i][1];$('#vals').textContent='accepted i: '+v.join(', ');$('#count').textContent=v.length+' iterations';$('#note').textContent='先列 condition 為 true 的 i，再數個數；不要由外型猜迭代次數。'});</script></body></html>
