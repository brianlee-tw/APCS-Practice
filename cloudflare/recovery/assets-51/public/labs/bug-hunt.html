<!doctype html><html lang="zh-Hant" data-typography="desktop-readable-v1" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-PFX" data-lesson="L-PFX-01" data-lab="bug-hunt" data-ui-build="bug-hunt-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>錯誤追查</title><link rel="stylesheet" href="/assets/apcs-ui.css"></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-PFX-01 · Bug Hunt</div><div class="labTitle">錯誤追查</div><div class="labSub">先找第一個 root cause，再看修正版；用最小反例修正心智模型。</div></div><button id="themeBtn" class="themeBtn" type="button">System / Dark / Light</button></header><main class="labBody"><div class="grid2"><section class="card" data-tone="red"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>Bug scenario</h3><div id="scenario" class="body12"></div><div id="opts" class="choiceRow" style="--cols:2;margin-top:12px"></div><button id="check" class="btn primary" style="margin-top:12px">判斷根因</button></section><section class="card" data-tone="green"><h3>Root cause</h3><div id="fb" class="callout" style="--tone:var(--green)">先選最早出錯的 mental model，不要只選最後看到的錯誤輸出。</div><button id="next" class="btn" style="margin-top:12px" disabled>下一個案例</button><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>先定位是 representation、index conversion、formula 還是 type 的第一個錯誤，不要直接換一份新程式。</div></section></div></main></div></div><div class="toast"><b></b><p></p></div><script src="/assets/apcs-ui.js"></script><script>document.getElementById('themeBtn').onclick=()=>APCS_UI.theme();const B=[
{s:'程式對 [2,2] 回傳 0。',o:['忘記 long long','用了 pre[r]-pre[l]','pre 開太大','for 迴圈太慢'],a:1,why:'inclusive [r,r] 必須留下 a[r]；pre[r]-pre[r] 一定是 0。最小反例直接鎖定 off-by-one。'},
{s:'n=1 時存取 pre[1] 越界。',o:['pre 只開 n 格','資料有負數','查詢太多','忘記排序'],a:0,why:'pre 表示 n+1 個 boundary states，所以即使只有 1 個元素也需要 pre[0]、pre[1]。'},
{s:'把 a[1] 改掉後，舊 pre 回答仍是修改前的結果。',o:['prefix 不支援負數','prefix table 已過期','C++ vector 不能更新','r+1 錯了'],a:1,why:'普通 prefix 是對「靜態快照」的預處理；資料更新後，受影響位置以後的累積值都失效。'}];let i=0;const $=s=>document.querySelector(s);function render(){const b=B[i];$('#scenario').textContent=b.s;$('#opts').innerHTML=b.o.map((x,j)=>'<span><input class="choiceInput" type="radio" name="bug" id="b'+j+'" value="'+j+'"><label class="choiceBox" for="b'+j+'" style="--tone:var(--red)"><div class="choiceTitle">'+APCS_UI.esc(x)+'</div></label></span>').join('');$('#fb').style.setProperty('--tone','var(--green)');$('#fb').textContent='先選最早出錯的 mental model，不要只選最後看到的錯誤輸出。';$('#next').disabled=true}$('#check').onclick=()=>{const b=B[i],v=+(document.querySelector('input[name=bug]:checked')||{value:-1}).value;if(v===b.a){$('#fb').style.setProperty('--tone','var(--green)');$('#fb').innerHTML='<b class="statusGood">根因正確</b> · '+b.why;$('#next').disabled=false}else{$('#fb').style.setProperty('--tone','var(--amber)');$('#fb').innerHTML='<b class="statusWarn">再往前找</b> · 目前選到的可能是症狀，不是第一個錯誤假設。'}};$('#next').onclick=()=>{i=(i+1)%B.length;render()};render();</script></body></html>
