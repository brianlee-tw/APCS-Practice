<!doctype html><html lang="zh-Hant" data-typography="desktop-readable-v1" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-PFX" data-lesson="L-PFX-01" data-lab="boundary" data-ui-build="boundary-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>邊界位置視覺化</title><link rel="stylesheet" href="/assets/apcs-ui.css"></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-PFX-01 · Core Model</div><div class="labTitle">邊界位置視覺化</div><div class="labSub">把 a[i] 看成從 boundary i 走到 boundary i+1 時跨過的那一格。</div></div><button id="themeBtn" class="themeBtn" type="button">System / Dark / Light</button></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>邊界模型</h3><div id="arr" class="array"></div><div style="margin-top:14px"><span class="label">跨過第 i 個元素</span><input id="i" class="field" type="range" min="0" max="4" value="0"></div></section><section class="card" data-tone="cyan"><h3>目前一步</h3><div class="metricGrid"><div class="metric"><span>i</span><b id="mi"></b></div><div class="metric"><span>pre[i]</span><b id="pl"></b></div><div class="metric"><span>pre[i+1]</span><b id="pr"></b></div></div><div id="formula" class="callout" style="--tone:var(--cyan);margin-top:12px"></div><div class="helper">重點：pre 的索引代表「已跨過幾個元素」，不是對應某個 a[i]。</div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>prefix array 的邊界是 representation contract；先定義 pre[0] 與區間端點，再套公式。</div></section></div></main></div></div><div class="toast"><b></b><p></p></div><script src="/assets/apcs-ui.js"></script><script>document.getElementById('themeBtn').onclick=()=>APCS_UI.theme();const A=[4,-2,7,1,3],PRE=[0,4,2,9,10,13],$=s=>document.querySelector(s);function r(){const i=+$('#i').value;$('#arr').innerHTML=A.map((v,j)=>'<div class="cell '+(j===i?'active':'')+'"><span class="idx">a['+j+']</span><span class="val">'+v+'</span></div>').join('');$('#mi').textContent=i;$('#pl').textContent=PRE[i];$('#pr').textContent=PRE[i+1];$('#formula').innerHTML='<span class="mono">pre['+(i+1)+'] = pre['+i+'] + a['+i+'] = '+PRE[i]+' + ('+A[i]+') = '+PRE[i+1]+'</span>'}$('#i').oninput=r;r();</script></body></html>
