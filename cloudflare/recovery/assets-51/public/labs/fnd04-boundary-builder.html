<!doctype html><html lang="zh-Hant" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-FND" data-lesson="L-FND-04" data-lab="fnd04-boundary-builder" data-ui-build="fnd04-boundary-builder-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Boundary Test Builder</title><link rel="stylesheet" href="/assets/apcs-ui.css"><style>.labLead{font-size:14px;color:var(--text2);max-width:900px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.stage{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.025)}.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choiceGrid button{min-height:52px}.choiceGrid button.on{outline:2px solid var(--cyan)}.steps{display:grid;gap:8px}.step{border:1px solid var(--line);border-radius:12px;padding:11px;background:rgba(255,255,255,.025)}.step.on{border-color:var(--cyan);background:rgba(89,214,255,.08)}.metric2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:28px;font-weight:900}.muted{color:var(--muted)}@media(max-width:800px){.choiceGrid,.metric2{grid-template-columns:1fr}}</style></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-FND-04 · Testing</div><div class="labTitle">Boundary Test Builder</div><div class="labSub">依切換點選 testcase，而不是隨機多測。</div></div></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>規格：x &gt;= 10</h3><div id="choices" class="choiceGrid"></div></section><section class="card" data-tone="cyan"><h3>Information value</h3><div id="fb" class="callout" style="--tone:var(--cyan)"></div><div class="stage" style="margin-top:12px">通用模板：min、threshold-1、threshold、threshold+1、max、特殊 branch / tie。</div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>boundary testcase 應直接攻擊比較符號、容器端點、空/單元素與最大值，而不是隨機湊數。</div></section></div></main></div></div><script src="/assets/apcs-ui.js"></script><script>const O=[['9 / 10 / 11','直接夾住切換點',1],['1 / 2 / 3','只測一般 false 區',0],['100','只測 true 區',0],['7 / 42','沒有精準對準 boundary',0]];const $=x=>document.querySelector(x);$('#choices').innerHTML=O.map((x,i)=>'<button class="btn" data-i="'+i+'">'+x[0]+'</button>').join('');document.querySelectorAll('#choices button').forEach(b=>b.onclick=()=>{const x=O[+b.dataset.i];$('#fb').style.setProperty('--tone',x[2]?'var(--green)':'var(--amber)');$('#fb').textContent=x[1]});</script></body></html>
