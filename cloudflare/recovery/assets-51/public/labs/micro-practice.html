<!doctype html><html lang="zh-Hant" data-typography="desktop-readable-v1" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-PFX" data-lesson="L-PFX-01" data-lab="micro-practice" data-ui-build="micro-practice-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>微型練習</title><link rel="stylesheet" href="/assets/apcs-ui.css"></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-PFX-01 · Micro Practice</div><div class="labTitle">微型練習</div><div class="labSub">5 個小步驟：手算 → 邊界 → index → 核心程式；每次只增加一點負荷。</div></div><button id="themeBtn" class="themeBtn" type="button">System / Dark / Light</button></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><div class="pillRow"><span id="stepPill" class="pill"></span><span id="scorePill" class="pill"></span></div><h3 id="q" style="margin-top:12px"></h3><div id="prompt" class="body12"></div><div id="answerArea" style="margin-top:12px"></div><div id="fb" class="callout" style="display:none;margin-top:10px"></div><div style="display:flex;gap:7px;margin-top:12px"><button id="check" class="btn primary">檢查</button><button id="next" class="btn" disabled>下一題</button></div></section><section class="card" data-tone="cyan"><h3>進度</h3><div class="progress"><span id="prog"></span></div><div class="callout" style="--tone:var(--cyan);margin-top:12px">答錯時只給局部提示；完成這 5 題後再進 C++，避免只看懂公式卻不會自己重建。</div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>先手算 prefix 與 query，再寫 code；能從資料關係重建公式，比背模板更可靠。</div></section></div></main></div></div><div class="toast"><b></b><p></p></div><script src="/assets/apcs-ui.js"></script><script>document.getElementById('themeBtn').onclick=()=>APCS_UI.theme();const S=[
{t:'A｜填 prefix',p:'a = [5, 2, -3, 4]，完整 pre 是？',type:'text',a:'0,5,7,4,8',hint:'pre[0]=0，每跨過一個 a[i] 就多一格。'},
{t:'B｜單一區間',p:'a=[4,-2,7,1,3]，pre=[0,4,2,9,10,13]。sum[1,3] = ?',type:'text',a:'6',hint:'先拿 pre[4]，再扣 pre[1]。'},
{t:'C｜右端點',p:'inclusive [l,r] 的右邊界應該讀哪個 prefix？',type:'choice',opts:['pre[r-1]','pre[r]','pre[r+1]'],a:'pre[r+1]',hint:'pre[k] 代表前 k 個元素。'},
{t:'D｜索引轉換',p:'Judge 給 1-index [2,4]，轉成內部 0-index 是？',type:'choice',opts:['[1,3]','[2,4]','[1,4]'],a:'[1,3]',hint:'左右端點都各減 1。'},
{t:'E｜核心程式',p:'補完：pre[i+1] = ________',type:'text',a:'pre[i]+a[i]',hint:'從 boundary i 跨過 a[i] 到 boundary i+1。'}];let i=0,score=0,wrong=0;const $=s=>document.querySelector(s);function norm(x){return String(x).replace(/\s/g,'').replace(/[\[\]]/g,m=>m).toLowerCase()}function render(){const s=S[i];$('#stepPill').textContent='0'+(i+1)+' / 05';$('#scorePill').textContent='已通過 '+score;$('#q').textContent=s.t;$('#prompt').textContent=s.p;$('#fb').style.display='none';$('#next').disabled=true;$('#check').disabled=false;if(s.type==='text')$('#answerArea').innerHTML='<input id="ans" class="field" autocomplete="off" placeholder="輸入答案">';else $('#answerArea').innerHTML='<div class="choiceRow" style="--cols:'+s.opts.length+'">'+s.opts.map((o,j)=>'<span><input class="choiceInput" type="radio" name="ans" id="o'+j+'" value="'+APCS_UI.esc(o)+'"><label class="choiceBox" for="o'+j+'" style="--tone:var(--cyan)"><div class="choiceTitle">'+APCS_UI.esc(o)+'</div></label></span>').join('')+'</div>';$('#prog').style.setProperty('--p',(i/5*100)+'%')}function val(){const s=S[i];if(s.type==='text')return $('#ans').value;return (document.querySelector('input[name=ans]:checked')||{}).value||''}$('#check').onclick=()=>{const s=S[i],ok=norm(val())===norm(s.a);$('#fb').style.display='block';if(ok){if(!$('#check').dataset.done){score++;$('#check').dataset.done='1'}$('#fb').style.setProperty('--tone','var(--green)');$('#fb').innerHTML='<b class="statusGood">正確</b> · '+APCS_UI.esc(s.a);$('#next').disabled=false;$('#check').disabled=true}else{wrong++;$('#fb').style.setProperty('--tone','var(--amber)');$('#fb').innerHTML='<b class="statusWarn">再試一次</b> · '+APCS_UI.esc(s.hint)}};$('#next').onclick=()=>{delete $('#check').dataset.done;if(i<4){i++;render()}else{$('#prog').style.setProperty('--p','100%');$('#q').textContent='Micro Practice 完成';$('#prompt').textContent='你已從手算走到能重建核心程式。';$('#answerArea').innerHTML='<div class="metricGrid"><div class="metric"><span>通過</span><b>'+score+'/5</b></div><div class="metric"><span>重試</span><b>'+wrong+'</b></div><div class="metric"><span>下一步</span><b>C++</b></div></div>';$('#check').style.display=$('#next').style.display='none';$('#fb').style.display='none'}};render();</script></body></html>
