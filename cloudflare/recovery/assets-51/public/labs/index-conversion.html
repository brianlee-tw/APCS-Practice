<!doctype html><html lang="zh-Hant" data-typography="desktop-readable-v1" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-PFX" data-lesson="L-PFX-01" data-lab="index-conversion" data-ui-build="index-conversion-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>索引轉換實驗室</title><link rel="stylesheet" href="/assets/apcs-ui.css"></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-PFX-01 · Index Mapping</div><div class="labTitle">索引轉換實驗室</div><div class="labSub">Judge 的座標先轉成教材內統一的 0-index，再使用唯一一套 prefix 公式。</div></div><button id="themeBtn" class="themeBtn" type="button">System / Dark / Light</button></header><main class="labBody"><div class="grid2"><section class="card" data-tone="amber"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>Judge 輸入｜1-index inclusive</h3><div class="grid2"><label><span class="label">l</span><input id="l" class="field" type="range" min="1" max="5" value="2"></label><label><span class="label">r</span><input id="r" class="field" type="range" min="1" max="5" value="4"></label></div><div id="judgeRange" class="callout" style="--tone:var(--amber);margin-top:12px"></div></section><section class="card" data-tone="cyan"><h3>內部表示｜0-index</h3><div class="metricGrid"><div class="metric"><span>l0</span><b id="l0"></b></div><div class="metric"><span>r0</span><b id="r0"></b></div><div class="metric"><span>prefix</span><b id="ans"></b></div></div><div id="formula" class="callout" style="--tone:var(--cyan);margin-top:12px"></div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>Judge index 與內部 index 是兩個座標系；先轉換一次，再只使用一套 0-index contract。</div></section></div></main></div></div><div class="toast"><b></b><p></p></div><script src="/assets/apcs-ui.js"></script><script>document.getElementById('themeBtn').onclick=()=>APCS_UI.theme();const A=[4,-2,7,1,3],PRE=[0,4,2,9,10,13],$=s=>document.querySelector(s);function r(ch){let l=+$('#l').value,rr=+$('#r').value;if(l>rr){if(ch==='l')rr=l;else l=rr;$('#l').value=l;$('#r').value=rr}const l0=l-1,r0=rr-1,ans=PRE[r0+1]-PRE[l0];$('#judgeRange').innerHTML='Judge：<span class="mono">['+l+','+rr+']</span> → 兩端都包含';$('#l0').textContent=l0;$('#r0').textContent=r0;$('#ans').textContent=ans;$('#formula').innerHTML='<span class="mono">['+l+','+rr+']₁ → ['+l0+','+r0+']₀ → pre['+(r0+1)+'] - pre['+l0+'] = '+ans+'</span>'}$('#l').oninput=()=>r('l');$('#r').oninput=()=>r('r');r();</script></body></html>
