<!doctype html><html lang="zh-Hant" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-FND" data-lesson="L-FND-04" data-lab="fnd04-integer-conversion" data-ui-build="fnd04-integer-conversion-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Integer Conversion Lab</title><link rel="stylesheet" href="/assets/apcs-ui.css"><style>.labLead{font-size:14px;color:var(--text2);max-width:900px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.stage{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.025)}.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choiceGrid button{min-height:52px}.choiceGrid button.on{outline:2px solid var(--cyan)}.steps{display:grid;gap:8px}.step{border:1px solid var(--line);border-radius:12px;padding:11px;background:rgba(255,255,255,.025)}.step.on{border-color:var(--cyan);background:rgba(89,214,255,.08)}.metric2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:28px;font-weight:900}.muted{color:var(--muted)}@media(max-width:800px){.choiceGrid,.metric2{grid-template-columns:1fr}}</style></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-FND-04 · Numeric semantics</div><div class="labTitle">Integer Conversion Lab</div><div class="labSub">assignment type 不會回到過去改變右側已完成的 arithmetic。</div></div></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>Prediction</h3><div id="cases" class="choiceGrid"></div></section><section class="card" data-tone="cyan"><h3>Evaluation order</h3><div id="out" class="stage mono">先選 expression。</div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>conversion 的時間點會改變語意；先算後轉與先轉後算可能得到不同結果。</div></section></div></main></div></div><script src="/assets/apcs-ui.js"></script><script>const C=[['double x = 5 / 2;','5/2 在 int 下先得到 2\n再轉成 double → 2.0'],['double x = 5.0 / 2;','operand 有 double\n浮點 division → 2.5'],['long long x = 1LL * 50000 * 50000;','從第一個 multiplication 起就在 long long 下計算']];const $=x=>document.querySelector(x);$('#cases').innerHTML=C.map((x,i)=>'<button class="btn" data-i="'+i+'">'+APCS_UI.esc(x[0])+'</button>').join('');document.querySelectorAll('#cases button').forEach(b=>b.onclick=()=>{$('#out').textContent=C[+b.dataset.i][1]});</script></body></html>
