 時最先比對？","options":["expected/actual 每一步","最後 output"],"correct":0,"why":"first divergence 能縮小搜尋範圍。"}]},"debrief":"Simulation correctness 常由 transition order 決定。","family":"ordering-lab","why_html":"以可重排步驟檢查 transition order，直接暴露「先判斷/先更新」造成的結果差異。","template":"apcs-lab-product-v3"};</script><script src="/assets/apcs-lab-runtime-v3.js"></script></body></html>
