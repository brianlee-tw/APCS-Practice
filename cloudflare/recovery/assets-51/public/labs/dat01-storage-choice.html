ix"],"correct":0,"why":"一次掃描可直接累積。"},{"q":"最後要輸出修改後完整序列，應？","options":["保存 sequence","只留 count","只留 last"],"correct":0,"why":"最後輸出每個位置需要容器 state。"}]},"debrief":"Representation 應由後續操作需求決定，不是看到 n 個數就自動 vector。","family":"representation-mapper","why_html":"以拖選或配對把題目語意映射到 source/destination 或資料表示，讓表示錯誤立即可見。","template":"apcs-lab-product-v3"};</script><script src="/assets/apcs-lab-runtime-v3.js"></script></body></html>
