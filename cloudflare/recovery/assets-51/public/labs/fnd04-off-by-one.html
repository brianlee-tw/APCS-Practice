<!doctype html><html lang="zh-Hant" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-FND" data-lesson="L-FND-04" data-lab="fnd04-off-by-one" data-ui-build="fnd04-off-by-one-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Off-by-One Lab</title><link rel="stylesheet" href="/assets/apcs-ui.css"><style>.labLead{font-size:14px;color:var(--text2);max-width:900px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.stage{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.025)}.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choiceGrid button{min-height:52px}.choiceGrid button.on{outline:2px solid var(--cyan)}.steps{display:grid;gap:8px}.step{border:1px solid var(--line);border-radius:12px;padding:11px;background:rgba(255,255,255,.025)}.step.on{border-color:var(--cyan);background:rgba(89,214,255,.08)}.metric2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:28px;font-weight:900}.muted{color:var(--muted)}@media(max-width:800px){.choiceGrid,.metric2{grid-template-columns:1fr}}</style></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-FND-04 · Minimal case</div><div class="labTitle">Off-by-One Lab</div><div class="labSub">找能最早暴露錯誤的 n，而不是只在大資料看到 final WA。</div></div></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><h3>1｜題目與預測</h3><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><div class="code">for(int i=1;i&lt;n;++i) cout &lt;&lt; i;</div><p class="labLead">規格要印 1..n。哪個 n 是最小反例？</p><div id="choices" class="choiceGrid"></div></section><section class="card" data-tone="cyan"><h3>2｜操作、觀察與解釋</h3><div id="fb" class="callout" style="--tone:var(--cyan)"></div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>最小反例比大型 WA 更有資訊量；先縮小輸入直到錯誤仍存在，再讀第一個錯誤 transition。</div></section></div></main></div></div><script src="/assets/apcs-ui.js"></script><script>const O=[['n=1',1],['n=2',0],['n=100',0],['n=100000',0]];const $=x=>document.querySelector(x);$('#choices').innerHTML=O.map((x,i)=>'<button class="btn" data-i="'+i+'">'+x[0]+'</button>').join('');document.querySelectorAll('#choices button').forEach(b=>b.onclick=()=>{const g=O[+b.dataset.i][1];$('#fb').style.setProperty('--tone',g?'var(--green)':'var(--amber)');$('#fb').textContent=g?'n=1 時 loop 完全不進，已足以證明右端點漏掉。':'它也可能失敗，但不是最小；先縮小 state space。'});</script></body></html>
