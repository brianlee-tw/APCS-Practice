<!doctype html><html lang="zh-Hant" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-FND" data-lesson="L-FND-04" data-lab="fnd04-ub-bug-hunt" data-ui-build="fnd04-ub-bug-hunt-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>UB Bug Hunt</title><link rel="stylesheet" href="/assets/apcs-ui.css"><style>.labLead{font-size:14px;color:var(--text2);max-width:900px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.stage{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.025)}.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choiceGrid button{min-height:52px}.choiceGrid button.on{outline:2px solid var(--cyan)}.steps{display:grid;gap:8px}.step{border:1px solid var(--line);border-radius:12px;padding:11px;background:rgba(255,255,255,.025)}.step.on{border-color:var(--cyan);background:rgba(89,214,255,.08)}.metric2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:28px;font-weight:900}.muted{color:var(--muted)}@media(max-width:800px){.choiceGrid,.metric2{grid-template-columns:1fr}}</style></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-FND-04 · C++ safety</div><div class="labTitle">UB Bug Hunt</div><div class="labSub">把「輸出怪怪的」分類成沒有合法語意的 root cause，而不是猜 wrap 值。</div></div></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>選一段</h3><div id="cases" class="choiceGrid"></div></section><section class="card" data-tone="cyan"><h3>Diagnosis</h3><div id="out" class="stage"></div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>Undefined Behavior 不能靠「這次跑起來沒事」證明正確；先檢查 index、lifetime、overflow 與未初始化狀態。</div></section></div></main></div></div><script src="/assets/apcs-ui.js"></script><script>const C=[['int x; ++x;','讀未初始化 automatic scalar；沒有建立已知 initial state。'],['int z = 7/0;','integer division by zero；不是「得到無限大」。'],['int a=2000000000; int b=a+a;','signed integer overflow 不是可依賴的 wrap contract。'],['long long x=1LL*1000000000*1000000000;','這個 expression 在 long long 下可表示，屬於安全對照組。']];const $=x=>document.querySelector(x);$('#cases').innerHTML=C.map((x,i)=>'<button class="btn" data-i="'+i+'">'+APCS_UI.esc(x[0])+'</button>').join('');document.querySelectorAll('#cases button').forEach(b=>b.onclick=()=>{$('#out').textContent=C[+b.dataset.i][1]});</script></body></html>
