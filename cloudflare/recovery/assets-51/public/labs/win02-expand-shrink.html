<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>L-WIN-02｜Expand / Shrink Window Simulator</title><link rel="stylesheet" href="/assets/apcs-ui.css"><link rel="stylesheet" href="/assets/apcs-lab-v3.css"></head>
<body class="lab"><div class="labShell"><header class="labTop"><div><div class="labEyebrow">L-WIN-02 · Hosted Lab</div><h1>Expand / Shrink Window Simulator</h1><p>右端擴張、失效時左端縮小，觀察合法性如何恢復。</p></div><div class="labTopActions"><div class="labProgress"><div class="labProgressTrack"><div id="labProgressFill"></div></div><b id="labProgressText">0/2</b></div><button class="btn" id="resetLab" type="button">重設</button></div></header><div class="labWhy"><b id="familyName">Interactive Lab</b> · <span id="whyHtml">Variable window 的關鍵是合法條件有方向；stepper 讓 learner 看見 R 每次只加一次，L 也只移過每個元素一次。</span></div><div id="labState" class="small">先完成判斷，再完成主要互動</div><main class="labBody"><div id="labApp"></div><section id="debrief" class="card labDebrief" hidden><h2>整理</h2><p>Amortized O(N) 來自 L/R 總移動次數，不是每個 R 都重新從頭找 L。</p></section></main><footer class="labFooter"><span>L-WIN-02 · trace-player</span><span>local state · accessible controls</span></footer></div><script>window.APCS_LAB_CONFIG={"slug":"win02-expand-shrink","lesson":"L-WIN-02","route":"win/sliding-window","title":"Expand / Shrink Window Simulator","subtitle":"右端擴張、失效時左端縮小，觀察合法性如何恢復。","family":"trace-player","curationFamily":"Simulator","why_html":"Variable window 的關鍵是合法條件有方向；stepper 讓 learner 看見 R 每次只加一次，L 也只移過每個元素一次。","layout":"single","predict":{"q":"若所有數值皆正，window sum > K。移動哪一端最可能讓 sum 朝 <=K 改善？","options":["L 向右","R 向右","L 向左","重設整個窗口"],"correct":0,"why":"移除正值會讓 sum 不增加，合法性朝可恢復方向前進。","retry":"先問每個端點移動對條件值的方向影響。"},"operate":{"mode":"stepper","states":["positive a=[2,1,4,1,1], K=5 · [L,R)=[0,0), sum=0","R 加入 2,1 → [0,2), sum=3 valid","R 加入 4 → [0,3), sum=7 invalid","L 移過 2 → [1,3), sum=5 valid；停止 shrink","R 繼續加入 1 → sum=6，L 再移過 1 → sum=5；兩端皆只前進"]},"debrief":"Amortized O(N) 來自 L/R 總移動次數，不是每個 R 都重新從頭找 L。"};</script><script src="/assets/apcs-lab-runtime-v3.js"></script></body></html>
