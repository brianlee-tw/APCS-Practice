<!doctype html><html lang="zh-Hant" data-typography="desktop-readable-v1" data-theme="dark" data-layout="comfortable-desktop" data-template="l-fnd-01-lab-v1" data-ui-version="5.12.1" data-unit="U-PFX" data-lesson="L-PFX-01" data-lab="method-choice" data-ui-build="method-choice-canonical-5.12.1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>方法適用性判斷</title><link rel="stylesheet" href="/assets/apcs-ui.css"></head><body><div class="lab"><div class="labShell"><header class="labTop"><div><div class="labKicker">L-PFX-01 · Method Choice</div><div class="labTitle">方法適用性判斷</div><div class="labSub">先看資料是否更新、查詢多不多、操作能否由兩個累積狀態還原。</div></div><button id="themeBtn" class="themeBtn" type="button">System / Dark / Light</button></header><main class="labBody"><div class="grid2"><section class="card" data-tone="violet"><div class="callout" data-lab-contract="predict-operate-explain" style="--tone:var(--violet);margin-bottom:12px"><b>Lab flow</b><br>先預測 → 操作/trace → 用一句話解釋結果。先想再點，不把 UI 當答案播放器。</div><h3>題目條件</h3><span class="label">資料是否更新</span><div class="segment" id="dynamic"><button data-v="static" class="on">靜態</button><button data-v="dynamic">會更新</button></div><span class="label" style="margin-top:11px">查詢數量</span><div class="segment" id="queries"><button data-v="one">1 次</button><button data-v="many" class="on">很多次</button></div><span class="label" style="margin-top:11px">操作</span><div class="segment" id="op"><button data-v="sum" class="on">區間和</button><button data-v="min">區間最小值</button></div></section><section class="card" data-tone="green"><h3>判斷</h3><div id="verdict" class="metric"></div><div id="why" class="callout" style="--tone:var(--green);margin-top:12px"></div><div class="helper">這個 Lab 判斷「普通一維靜態 prefix sum」是否合適，不代表所有 prefix 技巧。</div><div class="callout" data-lab-debrief="true" style="--tone:var(--green);margin-top:12px"><b>帶走的心智模型</b><br>是否用 Prefix Sum 要看是否存在「靜態資料 + 重複區間查詢」；不是看到 array 就自動套。</div></section></div></main></div></div><div class="toast"><b></b><p></p></div><script src="/assets/apcs-ui.js"></script><script>document.getElementById('themeBtn').onclick=()=>APCS_UI.theme();const S={dynamic:'static',queries:'many',op:'sum'},$=s=>document.querySelector(s);document.querySelectorAll('.segment button').forEach(b=>b.onclick=()=>{const g=b.parentElement.id;S[g]=b.dataset.v;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render()});function render(){let title,body,tone='green';if(S.dynamic==='dynamic'){title='不適合';body='資料會更新，舊 prefix 很快失效；普通靜態前綴和不是正確工具。';tone='red'}else if(S.op==='min'){title='不適合';body='min 不能像 sum 一樣用兩個 prefix 值相減還原區間答案。';tone='red'}else if(S.queries==='one'){title='可能不值得';body='只有 1 次區間和時，直接掃一次可能更簡單；先比較實際工作量。';tone='amber'}else{title='適合';body='靜態資料 + 大量區間和查詢：一次 O(N) 預處理後，每次查詢 O(1)。'}$('#verdict').innerHTML='<span>普通 Prefix Sum</span><b class="status'+(tone==='green'?'Good':tone==='amber'?'Warn':'Bad')+'">'+title+'</b>';$('#why').style.setProperty('--tone','var(--'+tone+')');$('#why').textContent=body}render();</script></body></html>
