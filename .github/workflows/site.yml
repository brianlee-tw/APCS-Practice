name: APCS Diagnostic Site

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate diagnostic content and engine
        working-directory: site
        run: npm run check
