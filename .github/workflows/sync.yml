name: APCS Dashboard Sync

on:
  push:
    branches:
      - main
    paths:
      - '**/*.cpp'
      - '**/*.py'
      - 'data/**'
      - 'notes/**'

permissions:
  contents: write

concurrency:
  group: apcs-dashboard-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate learning dashboard
        run: python tools/apcs.py sync

      - name: Commit generated indexes only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add README.md docs/PROBLEM_INDEX.md docs/REVIEW_QUEUE.md

          if git diff --cached --quiet; then
            echo "Generated indexes are already current."
            exit 0
          fi

          git commit -m "chore(sync): refresh APCS dashboard [skip ci]"
          git push origin HEAD:main
