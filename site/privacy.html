<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隱私說明｜APCS Diagnostic</title><link rel="stylesheet" href="./styles.css"></head><body><header class="site-header"><a class="brand" href="./">APCS Diagnostic</a></header><main><section class="panel"><h1>隱私說明</h1><p>目前的 MVP 採匿名優先設計，不要求姓名、學校、帳號或 Email。</p><h2>瀏覽器內事件</h2><p>測驗開始、作答、完成與商品興趣等事件會暫存在你的瀏覽器 localStorage，目的是先驗證事件 schema；目前沒有設定遠端分析端點，因此這些資料不會自動送到專案擁有者。</p><h2>分享</h2><p>分享結果只包含總分、最弱與最強能力，不含你的每題答案或身分資訊。</p><h2>正式上線前</h2><p>若未來加入分析、Email 或付款服務，本頁必須在啟用前更新，說明蒐集欄位、用途、保存期間與第三方處理者。</p></section></main></body></html>
